@if (useAppShell){
  <main class="app-layout" [class.app-layout--white-viewport]="useWhiteViewportBackground">
    <app-cockpit />
    <app-header />
    <section class="content-area">
      <div class="content-shell">
        <router-outlet />
      </div>
    </section>
    <aside class="empty-content-row" aria-hidden="true"></aside>
  </main>
} @else {
  <main class="app-layout-login">
    <section class="content-area">
      <div class="content-shell">
        <router-outlet />
      </div>
    </section>
    <aside class="empty-content-row" aria-hidden="true"></aside>
  </main>
}
